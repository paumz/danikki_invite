<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖤Wedding Invite🖤</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    
    
    <main>
        <p>Las historias más importantes se escriben junto a quienes dejan su huella en ellas...</p>
        <br><br>
        <h1>PAU & DAN</h1>
        <br><br>
        <p>Por eso queremos comenzar este nuevo capítulo y celebrar nuestra eternidad contigo.</p>        
        <br><br>
        <div class="opciones">
            <button class="opcion" id="fecha">
                <i data-lucide="calendar-days"></i>
                <span>FECHA</span>
            </button>

            <button class="opcion" id="lugar">
                <i data-lucide="map-pin"></i>
                <span>LUGAR</span>
            </button>

            <button class="opcion" id="dresscode">
                <i data-lucide="gem"></i>
                <span>DRESSCODE</span>
            </button>
        </div>
        <br><br>
        <p><i>En vida y en muerte.</i></p>

    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
