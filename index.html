<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pau & Dan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <main>
        <p>Las historias más importantes se escriben junto a quienes dejan su huella en ellas...</p>
        
        <h1>PAU & DAN</h1>

        <p>Por eso queremos comenzar este nuevo capítulo y celebrar nuestra eternidad contigo.</p>        

        <div class="opciones">
            <button class="opcion" id="fecha">
                <i data-lucide="calendar-days"></i>
                <span>FECHA</span>
            </button>

            <button class="opcion" id="lugar">
                <i data-lucide="map-pin"></i>
                <span>LUGAR</span>
            </button>

            <button class="opcion" id="dresscode">
                <i data-lucide="gem"></i>
                <span>DRESSCODE</span>
            </button>
        </div>
        <p><i>En vida y en muerte.</i></p>

    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
