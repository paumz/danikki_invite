<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🖤Confirmar asistencia🖤</title>
    <link rel="icon" type="image/png" href="favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="fondo-arboles"></div>
    <main>
        <h1>PAU & DAN</h1>
        <p class="subtitulo">
            CONFIRMACIÓN DE ASISTENCIA
        </p>

        <div class="separador">✦</div>

        <p class="saludo-confirmacion">
            <span id="nombre-invitado">Querido invitado</span>...
        </p>

        <p id="mensaje-invitados"></p>

        <p class="pregunta">
            ¿Tendremos el placer de contar con tu presencia?
        </p>

        <div class="respuestas">

            <button class="respuesta si" id="confirmar-si">
                SÍ, CONFIRMAR ASISTENCIA
            </button>

            <button class="respuesta no" id="confirmar-no">
                NO PODREMOS ASISTIR
            </button>

        </div>

        <a href="index.html" class="volver-inicio" id="volver-inicio">
            ← REGRESAR AL INICIO
        </a>

    </main>

    <script src="confirmar.js"></script>
